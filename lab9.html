<!DOCTYPE html>
<html>
<head>
    <title>Personal To-Do List</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white w-96 p-6 rounded-xl shadow-lg">

        <h1 class="text-2xl font-bold text-center mb-5">
            My To-Do List
        </h1>

        <div class="flex gap-2">
            <input id="task"
                   type="text"
                   placeholder="Enter your task"
                   class="border p-2 rounded-lg w-full">

            <button onclick="addTask()"
                    class="bg-blue-500 text-white px-4 rounded-lg">
                Add
            </button>
        </div>

        <ul id="list" class="mt-5 space-y-2"></ul>

    </div>


    <script>

        function addTask()
        {
            var task = document.getElementById("task").value;

            if(task == "")
            {
                alert("Please enter a task");
            }
            else
            {
                var list = document.getElementById("list");

                list.innerHTML +=
                    "<li class='bg-gray-100 p-3 rounded-lg' onclick='completeTask(this)'>"
                    + task +
                    " <button onclick='deleteTask(this)' class='bg-red-500 text-white px-2 py-1 rounded'>Delete</button>"
                    + "</li>";

                document.getElementById("task").value = "";
            }
        }


        function completeTask(task)
        {
            task.style.textDecoration = "line-through";
        }


        function deleteTask(button)
        {
            button.parentElement.remove();
        }

    </script>

</body>
</html>
